# Netlify — сомонаи TajikLang
#
# The site is generated by `python tools/build_site.py`, which also rebuilds
# the playground from the interpreter, so a deploy can never ship a playground
# that disagrees with the language.

[build]
  # python3, not python: Netlify builds on Linux, where `python`
  # may not exist at all.
  command = "python3 tools/build_site.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# GitHub Releases hold the multi-platform installers; these aliases keep the
# student-facing Netlify download URL short and always select Windows x64.
[[redirects]]
  from = "/download"
  to = "https://github.com/BahromPython/tajiklang-2.0.0/releases/latest/download/TajikLang-Studio-Setup-Windows-x64.exe"
  status = 302
  force = true

[[redirects]]
  from = "/боргирӣ"
  to = "https://github.com/BahromPython/tajiklang-2.0.0/releases/latest/download/TajikLang-Studio-Setup-Windows-x64.exe"
  status = 302
  force = true

# The install page was briefly published under a Cyrillic filename. Keep any
# link that escaped working, but serve the ASCII one from now on.
[[redirects]]
  # percent-encoded: Netlify matches redirect paths as they appear
  # in the request, and a raw Cyrillic path never matches.
  from = "/%D0%BD%D0%B0%D1%81%D0%B1.html"
  to = "/install.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
