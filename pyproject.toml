[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tajiklang"
version = "2.0.0"
description = "Забони барномасозӣ бо забони тоҷикӣ — a programming language with Tajik keywords, for Tajik-speaking students"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tajik", "programming-language", "interpreter", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Natural Language :: Tajik",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = []

[project.urls]
Homepage = "https://bahrompython.github.io/tajiklang/"
Source = "https://github.com/BahromPython/tajiklang"
Documentation = "https://github.com/BahromPython/tajiklang/blob/main/docs/дарсҳо.md"

[project.scripts]
tajik = "tajiklang.cli:main"
tajik-ide = "tajiklang.ide:main"

[tool.setuptools]
packages = ["tajiklang"]
