<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="TajikLang — забони барномасозӣ бо забони тоҷикӣ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1418"/>
      <stop offset="100%" stop-color="#132019"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35b48b"/>
      <stop offset="100%" stop-color="#35b48b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#rule)"/>

  <g font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
    <text x="72" y="126" font-size="62" font-weight="700" fill="#f2f6f9"
          letter-spacing="-1.5">TajikLang</text>
    <text x="72" y="172" font-size="25" fill="#8fa0ad">Забони барномасозӣ бо забони тоҷикӣ</text>
  </g>

  <g font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="21">
    <rect x="72" y="208" width="700" height="88" rx="12" fill="#0a0f12" stroke="#25313a"/>
    <text x="96" y="242" fill="#7cc4ff">бигзор<tspan fill="#e6ebf0"> ном = </tspan><tspan fill="#8ee08e">"Баҳром"</tspan></text>
    <text x="96" y="276" fill="#c9a0ff">навис<tspan fill="#e6ebf0">(</tspan><tspan fill="#8ee08e">"Салом,"</tspan><tspan fill="#e6ebf0">, ном)</tspan></text>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#7f8d9a">
    <text x="830" y="238">Ҳамаи калимаҳо, хатогиҳо ва</text>
    <text x="830" y="266">тартиби алифбо — тоҷикӣ.</text>
  </g>
</svg>
