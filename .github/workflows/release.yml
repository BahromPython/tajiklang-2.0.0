name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            python_arch: x64
          - label: x86
            python_arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python tools/build_exe.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: studio-electron
        run: npm install
      - working-directory: studio-electron
        run: npx electron-builder --win nsis --${{ matrix.label == 'x86' && 'ia32' || 'x64' }}
      - shell: pwsh
        run: |
          Move-Item dist/TajikLang-windows.zip "dist/TajikLang-windows-${{ matrix.label }}.zip"
          Move-Item "studio-electron/release/*.exe" "dist/TajikLang-Studio-Setup-Windows-${{ matrix.label }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: TajikLang-windows-${{ matrix.label }}
          path: |
            dist/TajikLang-Studio-Setup-Windows-${{ matrix.label }}.exe
            dist/TajikLang-windows-${{ matrix.label }}.zip

  macos:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: intel
            runner: macos-15-intel
            arch: x86_64
          - label: apple-silicon
            runner: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip pyinstaller
      - run: python3 tools/build_macos.py
        env:
          TAJIKLANG_ARCH: ${{ matrix.arch }}
          TAJIKLANG_VERSION: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: studio-electron
        run: npm install
      - working-directory: studio-electron
        run: npx electron-builder --mac dmg --${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - shell: bash
        run: |
          mv "studio-electron/release/"*.dmg "dist/TajikLang-Studio-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: TajikLang-macos-${{ matrix.label }}
          path: |
            dist/TajikLang-macos-${{ matrix.arch }}.zip
            dist/TajikLang-macos-${{ matrix.arch }}.pkg
            dist/TajikLang-Studio-macos-${{ matrix.arch }}.dmg

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python tools/build_linux.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: studio-electron
        run: npm install
      - working-directory: studio-electron
        run: npx electron-builder --linux AppImage --x64
      - shell: bash
        run: mv studio-electron/release/*.AppImage dist/TajikLang-Studio-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: TajikLang-linux-x64
          path: |
            dist/TajikLang-linux-x86_64.tar.gz
            dist/TajikLang-Studio-linux-x86_64.AppImage

  publish:
    name: Publish GitHub release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_vsix.py
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
            dist/*.vsix
